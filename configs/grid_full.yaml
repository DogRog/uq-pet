# Full selection/training grid: budgets x strategies x repeats.
budgets: [10, 25, 50, 100]
strategies:
  - random
  - uncertainty:mean_token_entropy
  - uncertainty:sequence_entropy
  - uncertainty:jaccard_distance
repeats: 5

llm:
  model: meta-llama/llama-3-8b-instruct
  num_samples: 5
  temperature: 0.7
  max_tokens: 1500
  seed: 3407
  max_concurrency: 8
  max_retries: 3

train:
  checkpoint: distilbert-base-cased
  epochs: 20
  batch_size: 8
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_fraction: 0.1
  max_length: 256
