[project]
name = "uq-pet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "compressed-tensors>=0.17.1",
    "datasets==2.19.2",
    "dotenv>=0.9.9",
    "gguf>=0.19.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "mlx>=0.31.2",
    "mlx-lm>=0.31.3",
    "nest-asyncio>=1.6.0",
    "openai>=2.44.0",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.0",
    "sentencepiece>=0.2.1",
    "seqeval>=1.2.2",
    "spacy>=3.8.14",
    "tabulate>=0.10.0",
    "torch>=2.12.1",
    "transformers>=5.12.1",
]

[project.scripts]
uq-pet = "uq_pet.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uq_pet"]
